

<!DOCTYPE html>

<html lang="es">

<head>
  <link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#111111">

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1">

<meta name="theme-color" content="#101827">

<title>StudyOS</title>

<style>

:root {

  color-scheme: dark;

  --bg: #0b1120;

  --panel: #141e30;

  --line: #2b3a50;

  --text: #f3f6fc;

  --muted: #9aa9bd;

  --accent: #b7d3ff;

  --green: #8ed8b1;

}

* { box-sizing: border-box; }

body {

  margin: 0;

  background: var(--bg);

  color: var(--text);

  font-family: -apple-system, BlinkMacSystemFont, sans-serif;

}

main { max-width: 600px; margin: auto; padding: 24px 17px 40px; }

header { display:flex; justify-content:space-between; align-items:center; }

.logo { font-size:25px; font-weight:800; }

.logo span { color:var(--accent); }

.muted { color:var(--muted); font-size:13px; }

h1 { font-size:31px; line-height:1.2; margin:30px 0 8px; }

.panel { background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:17px; margin:17px 0; }

.stats { display:grid; grid-template-columns:repeat(3,1fr); gap:9px; }

.stat { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:12px 8px; }

.stat strong { display:block; font-size:24px; }

.stat span { color:var(--muted); font-size:11px; }

input,select,button { font:inherit; border-radius:10px; padding:12px; }

input,select { width:100%; background:var(--bg); color:var(--text); border:1px solid var(--line); margin:5px 0 10px; }

button { border:0; cursor:pointer; }

.primary { width:100%; background:var(--accent); color:#101827; font-weight:700; }

.task { display:flex; align-items:flex-start; gap:10px; padding:13px 0; border-bottom:1px solid var(--line); }

.task:last-child { border-bottom:0; }

.task input { width:18px; margin-top:4px; }

.taskbody { flex:1; overflow-wrap:anywhere; }

.taskname { font-weight:650; }

.done .taskname { text-decoration:line-through; color:var(--muted); }

.tag { display:inline-block; color:var(--accent); font-size:11px; margin-top:5px; }

.delete { background:transparent; color:#f2a5a5; padding:3px 8px; }

.empty { text-align:center; padding:22px 0; color:var(--muted); }

footer { text-align:center; color:var(--muted); font-size:12px; padding:20px 0; }

</style>

</head>

<body>

<main>

  <header>

    <div>

      <div class="logo">Study<span>OS</span></div>

      <div class="muted">TU ESPACIO ACADÉMICO</div>

    </div>

    <div class="muted" id="date"></div>

  </header>

  <h1>Organiza tus ideas.<br>Alcanza tus metas.</h1>

  <p class="muted">Menos desorden. Más enfoque.</p>

  <section class="stats">

    <div class="stat"><strong id="total">0</strong><span>Total</span></div>

    <div class="stat"><strong id="pending">0</strong><span>Pendientes</span></div>

    <div class="stat"><strong id="doneCount">0</strong><span>Completadas</span></div>

  </section>

  <section class="panel">

    <h2>Mis tareas</h2>

    <p class="muted">Cada pequeño avance cuenta.</p>

    <form id="form">

      <input id="name" maxlength="120" placeholder="¿Qué necesitas estudiar?" required>

      <select id="subject">

        <option>General</option>

        <option>Matemáticas</option>

        <option>Español</option>

        <option>Inglés</option>

        <option>Biología</option>

        <option>Química</option>

        <option>Física</option>

        <option>Informática</option>

        <option>Otra</option>

      </select>

      <select id="priority">

        <option>Prioridad normal</option>

        <option>Prioridad alta</option>

        <option>Prioridad baja</option>

      </select>

      <button class="primary" type="submit">+ Añadir tarea</button>

    </form>

    <div id="list"></div>

    <p class="muted">Las tareas se guardan en este navegador.</p>

  </section>

  <footer>StudyOS · Un paso a la vez.</footer>

</main>

<script>

const $ = id => document.getElementById(id);

let tasks = [];

try { tasks = JSON.parse(localStorage.getItem("studyos_tasks") || "[]"); }

catch { tasks = []; }

function save() {

  try {

    localStorage.setItem("studyos_tasks", JSON.stringify(tasks));

  } catch {

    alert("No se pudieron guardar los cambios en este navegador.");

  }

}

function escapeHTML(s) {

  return String(s).replace(/[&<>"']/g, c => ({

    "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;"

  }[c]));

}

function render() {

  const done = tasks.filter(t => t.done).length;

  $("total").textContent = tasks.length;

  $("pending").textContent = tasks.length - done;

  $("doneCount").textContent = done;

  if (!tasks.length) {

    $("list").innerHTML = '<div class="empty">Aún no tienes tareas.<br>Añade la primera para comenzar.</div>';

    return;

  }

  $("list").innerHTML = tasks.map(t => `

    <div class="task ${t.done ? "done" : ""}">

      <input type="checkbox" data-check="${t.id}" ${t.done ? "checked" : ""} aria-label="Completar tarea">

      <div class="taskbody">

        <div class="taskname">${escapeHTML(t.name)}</div>

        <div class="muted">${escapeHTML(t.subject)}</div>

        <span class="tag">${escapeHTML(t.priority)}</span>

      </div>

      <button class="delete" data-delete="${t.id}" aria-label="Eliminar tarea">×</button>

    </div>

  `).join("");

}

$("form").addEventListener("submit", e => {

  e.preventDefault();

  const name = $("name").value.trim();

  if (!name) return;

  tasks.unshift({

    id: Date.now() + Math.random(),

    name,

    subject: $("subject").value,

    priority: $("priority").value,

    done: false

  });

  save();

  render();

  $("form").reset();

});

$("list").addEventListener("change", e => {

  if (!e.target.dataset.check) return;

  const id = Number(e.target.dataset.check);

  tasks = tasks.map(t => t.id === id ? {...t, done:e.target.checked} : t);

  save();

  render();

});

$("list").addEventListener("click", e => {

  if (!e.target.dataset.delete) return;

  const id = Number(e.target.dataset.delete);

  tasks = tasks.filter(t => t.id !== id);

  save();

  render();

});

$("date").textContent = new Date().toLocaleDateString("es-PA", {

  day:"numeric", month:"short"

});

render();

</script>

<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./service-worker.js")
      .catch((error) => {
        console.error("No se pudo activar el modo sin conexión:", error);
      });
  });
}
</script>

</body>

</html>
